[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lethes"
version = "2.0.0a1"
description = "Branch-aware original-text recall and cache-stable context for long chats"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.11", "mypy>=1.10"]
tokenizers = ["tiktoken>=0.7"]
litellm = ["litellm>=1.108.1,<2"]

[project.urls]
Repository = "https://github.com/kb5000/lethes"

[tool.hatch.build.targets.wheel]
packages = ["src/lethes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
