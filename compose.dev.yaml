services:
  lethes:
    command: ["uvicorn", "lethes.service:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src", "--reload-dir", "/app/config", "--reload-include", "*.py", "--reload-include", "*.json"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./src:/app/src:ro
